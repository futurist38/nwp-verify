name: obs-hourly

# 관측·나우캐스트 시간별 갱신 (2026-08-21 사용자 요청 — "8시인데 6시 관측만 보임").
# ASOS 시간자료는 정시 후 10~15분께 확정.
#
# 실행 주체는 외부 스케줄러(Cloudflare Worker)의 workflow_dispatch 다 (2026-09-01).
#   9/2 실측: 00:25~19:25 20회 전부 발동, 오차 초 단위. 같은 날 깃헙 예약은 5회뿐.
# 아래 cron 은 그 Worker 가 죽었을 때(토큰 만료·Cloudflare 장애) 사이트가 완전히
# 멎지 않게 하는 **하루 1회 심장박동**이다. 정시성은 기대하지 않는다:
#   8/25 23회, 8/26 21회 → 8/27부터 5일 연속 하루 1~6회 (당시 매시 예약, 기대 24회).
#   발동 분도 :25 가 아니라 :06~:59 로 제멋대로였다.
# 공식 문서가 "부하가 높으면 대기 중인 작업 일부가 버려질 수 있다"고 명시한 동작이며,
# 빈도를 올리면 제재한다는 규칙은 문서·커뮤니티 어디에도 없다(예전 이 주석의 추정은
# 근거가 없어 삭제). 커뮤니티는 같은 증상을 '새 저장소'와 연결한다(본 저장소 8/19 생성).
# 매시로 두면 하루 5회쯤 중복 실행돼 기상청 API 를 헛되이 두들기고 대기열 충돌로
# 취소까지 유발했다(9/2 실측) → 하루 1회로 줄였다. 지연 발동이 정상 실행과 겹치면
# gate 가 걸러낸다(최근 2시간 안에 성공한 실행이 있으면 건너뜀).
#
# 2026-09-06: daily.yml 과 concurrency 그룹을 **분리**했다. 공유하던 시절 이 워크플로가
# daily 전체(기상청 API 가 막히는 날 80~100분)를 기다리다 다음 시간분에 밀려 취소됐다 →
# 관측·예보-관측이 2~3시간씩 멈춤(9/5 실측: 21:26Z 취소, 22:26Z 대기). 발행 경합은
# tools/publish_site.sh 의 낙관적 잠금 + build_site.py 의 무회귀 가드가 막는다.

on:
  schedule:
    - cron: "25 12 * * *"   # 21:25 KST — 하루치 관측이 다 쌓인 뒤라 한 번에 가장 많이 채운다
  workflow_dispatch:
    inputs:
      force:
        description: "최소 간격을 무시하고 강제 실행"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # gate 잡의 `gh run list` 에 필요 (명시하면 나머지는 none 이 된다)

concurrency:
  group: obs-hourly
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}

jobs:
  # 외부 스케줄러의 토큰이 유출되더라도 workflow_dispatch 를 연타해 기상청 API 를
  # 두들기지 못하게 막는다. 정상 운영(매시 1회)에는 걸리지 않는 간격이다.
  # 막힌 실행은 실패가 아니라 'skipped' 로 남는다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP_MIN: "20"
          RECENT_OK_MIN: "120"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # 심장박동은 Worker 가 죽었을 때만 의미가 있다. 최근에 성공한 실행이 있으면 건너뛴다
            # (예약은 4~5시간 늦게 발동하는 일이 잦아 정상 실행과 겹친다). 조회 실패 시 진행.
            PREV=$(gh run list -w obs-hourly.yml --status success -L 3 --json databaseId,createdAt \
                   -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | .[0].createdAt" || true)
            if [ -n "$PREV" ]; then
              AGE=$(( ($(date -u +%s) - $(date -u -d "$PREV" +%s)) / 60 ))
              if [ "$AGE" -lt "$RECENT_OK_MIN" ]; then
                echo "::notice::${AGE}분 전에 성공한 실행이 있음 — 심장박동 건너뜀"
                echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
            echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 조회가 실패하면 막지 말고 통과시킨다. 가드는 남용을 늦추는 장치일 뿐,
          # 이것 때문에 정상 운영이 멈추는 쪽이 훨씬 나쁘다.
          PREV=$(gh run list -w obs-hourly.yml -L 5 --json databaseId,createdAt                  -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | .[0].createdAt" || true)
          if [ -z "$PREV" ]; then
            echo "직전 실행 조회 불가 또는 없음 — 진행"; echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(( ($(date -u +%s) - $(date -u -d "$PREV" +%s)) / 60 ))
          if [ "$AGE" -lt "$MIN_GAP_MIN" ]; then
            echo "::warning::직전 실행 ${AGE}분 전 — 최소 간격 ${MIN_GAP_MIN}분 미만이라 건너뜀"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "직전 실행 ${AGE}분 전 — 진행"; echo "go=1" >> "$GITHUB_OUTPUT"
          fi

  obs:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nowcast.txt

      - name: 시스템 의존성 (한글 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: Python 의존성
        run: pip install -r requirements.txt

      - name: 관측 수신·지도 생성 (어제+오늘)
        run: timeout 600 python plot_obsmap.py --no-plot

      - name: 단기예보 vs 실측 시계열
        # KMA API가 붐비면 발표시각 수신이 10분+ (2026-08-25 실측: 이 단계가 잡 상한을
        # 먹고 관측 발행까지 스킵). 개별 상한으로 격리 — 실패해도 관측은 나간다
        run: timeout 480 python plot_kmafcst.py --no-fetch --no-plot || echo "::warning::단기예보 비교 실패/시간초과 — 계속"

      - name: 나우캐스트 가중치 (Release 자산)
        id: ncw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          if gh release download nowcast-weights -p "gk2a_v5*" -D dl --clobber; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::나우캐스트 가중치 릴리스 없음 — 단계 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 운량 나우캐스트 (M4 추론·표출·지속채점)
        if: steps.ncw.outputs.ok == 'true'
        run: |
          pip install -q -r requirements-nowcast.txt
          timeout 600 python nowcast_live.py || echo "::warning::나우캐스트 실패/시간초과 — 계속"

      - name: 사이트 조립·발행 (관측·예보-관측·나우캐스트만 갱신)
        run: |
          git config user.name "nwp-bot"
          git config user.email "actions@users.noreply.github.com"
          tools/publish_site.sh "obs $(date '+%Y-%m-%d %H:%M KST')" --hourly

      # 검증 CSV 커밋은 사이트 발행 뒤에 — 실패해도 관측/나우캐스트 표출은 이미 배포됨.
      # (2026-08-25: 이 단계가 앞에 있다가 실패해 관측 갱신이 4시간 멈춤. 작업트리에
      #  obs·kmafcst 캐시 변경이 남아 있어 rebase가 거부됨 → autostash 필수)
      - name: 나우캐스트 검증 CSV 커밋
        if: steps.ncw.outputs.ok == 'true'
        continue-on-error: true
        run: |
          git add verification/nowcast 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "nowcast 검증 $(date '+%Y-%m-%d %H:%M KST')"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull -q --rebase origin main && git push -q origin main && break
              echo "::warning::main push 충돌 — 재시도 $i"; sleep 5
            done
          fi
