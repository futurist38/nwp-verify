name: obs-hourly

# 관측 실황 지도만 시간별로 갱신 (2026-08-21 사용자 요청 — "8시인데 6시 관측만 보임").
# ASOS 시간자료는 정시 후 10~15분께 확정 → 매시 20분 실행, 지연 약 20~80분.
# 전체 파이프라인(daily.yml)과 site-data 발행이 겹치지 않게 concurrency 그룹 공유.

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nwp-site-publish
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8
  KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}

jobs:
  obs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nowcast.txt

      - name: 시스템 의존성 (한글 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: Python 의존성
        run: pip install -r requirements.txt

      - name: 관측 수신·지도 생성 (어제+오늘)
        run: python plot_obsmap.py

      - name: 단기예보 vs 실측 시계열
        run: python plot_kmafcst.py --no-fetch || echo "::warning::단기예보 비교 실패 — 계속"

      - name: site-data 복원 (나우캐스트 채점 대기분 포함)
        run: |
          mkdir -p site_build
          git fetch origin site-data
          git --work-tree=site_build checkout FETCH_HEAD -- .
          git reset > /dev/null
          # 이전 런의 채점 대기 예측장 복원 (러너 휘발성 대응)
          if [ -d site_build/nowcast/fields ]; then
            mkdir -p output/nowcast/fields
            cp site_build/nowcast/fields/*.npz output/nowcast/fields/ 2>/dev/null || true
          fi

      - name: 나우캐스트 가중치 (Release 자산)
        id: ncw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          if gh release download nowcast-weights -p "gk2a_scratch.h5" -D dl --clobber; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::나우캐스트 가중치 릴리스 없음 — 단계 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 운량 나우캐스트 (M4 추론·표출·지속채점)
        if: steps.ncw.outputs.ok == 'true'
        run: |
          pip install -q -r requirements-nowcast.txt
          python nowcast_live.py || echo "::warning::나우캐스트 실패 — 계속"

      - name: 나우캐스트 검증 CSV 커밋
        if: steps.ncw.outputs.ok == 'true'
        run: |
          git config user.name "nwp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add verification/nowcast 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "nowcast 검증 $(date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 사이트 조립·발행
        run: |
          python build_site.py --site-dir site_build
          git config user.name "nwp-bot"
          git config user.email "actions@users.noreply.github.com"
          export GIT_INDEX_FILE="$(pwd)/.git/site-index"
          git --work-tree=site_build add -A
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          COMMIT=$(git commit-tree "$TREE" -m "obs $(date '+%Y-%m-%d %H:%M KST')")
          git push --force origin "$COMMIT:refs/heads/site-data"
