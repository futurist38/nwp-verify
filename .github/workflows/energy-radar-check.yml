name: energy-radar-check
on:
  push:
    paths: ['.github/workflows/energy-radar-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Verify HSR graphic
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
        run: |
          PYTHONPATH=energy_runtime python - <<'PY'
          from energy_data import fetch_radar_image,KST
          import datetime as dt,base64,json
          from pathlib import Path
          p=Path('/tmp/radar-check.png')
          r=fetch_radar_image(dt.datetime(2026,10,29,7,tzinfo=KST),p)
          print(json.dumps(r))
          if not r['available']:
              import os,urllib.request,urllib.parse
              for host in ['apihub.kma.go.kr','apihub-pub.kma.go.kr']:
                  params=dict(tm='202610290700',cmp='HSR',qcd='HSLP',obs='ECHD',color='C4',aws=0,map='HR',grid=2,legend=1,size=600,itv=5,zoom_level=0,zoom_x='0000000',zoom_y='0000000',authKey=os.environ['KMA_AUTH_KEY'])
                  try:
                      with urllib.request.urlopen('https://'+host+'/api/typ03/cgi/rdr/nph-rdr_cmp1_img?'+urllib.parse.urlencode(params),timeout=45) as response:
                          body=response.read()
                          print(host,response.status,response.headers.get('Content-Type'),len(body))
                          from PIL import Image
                          import io
                          im=Image.open(io.BytesIO(body));im.load();im.save(p)
                          r['available']=True
                          print('SUCCESS_HOST='+host)
                          break
                  except Exception as e:
                      print(host,type(e).__name__,getattr(e,'code',None))
              assert r['available'], 'HSR graphic fetch failed'
          print('RADAR_PNG_BASE64='+base64.b64encode(p.read_bytes()).decode())
          PY
