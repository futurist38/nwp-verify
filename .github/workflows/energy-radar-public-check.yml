name: energy-radar-public-check
on:
  push:
    paths: ['.github/workflows/energy-radar-public-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public radar graphic
        shell: python
        run: |
          import urllib.request,urllib.parse,re,json,datetime,struct,base64
          def get(url,origin=False):
              req=urllib.request.Request(url,headers={'Origin':'https://futurist38.github.io'} if origin else {})
              with urllib.request.urlopen(req,timeout=25) as r:return r.read(3000000),dict(r.headers)
          def inspect(url):
              b,h=get(url);s=b.decode('utf-8','replace')
              print('PAGE',url,'BYTES',len(b),flush=True)
              lines=s.splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(r'nph-rdr_cmp|cgi-bin/center|radar_comp_gis|UNIT_BAR|crossOrigin|crossorigin',l)]
              indexes=set()
              for i in hits:indexes.update(range(max(0,i-3),min(len(lines),i+12)))
              for i in sorted(indexes):print('SOURCE',i,lines[i][:1500],flush=True)
              return s
          s=inspect('https://radar.kma.go.kr/radar/main2.do')
          tm=(datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))-datetime.timedelta(minutes=10)).strftime('%Y%m%d%H%M')
          tm=tm[:-1]+str(int(tm[-1])//5*5)
          if 'nph-rdr_cmp1_img' in s:
              p=dict(tm=tm,cmp='HSR',qcd='HSLP',obs='ECHD',color='C4',aws='0',acc='',map='HR',grid='2',legend='1',size='600',itv='5',zoom_level='0',zoom_x='0000000',zoom_y='0000000',gov='')
              u='https://radar.kma.go.kr/cgi-bin/center/nph-rdr_cmp1_img?'+urllib.parse.urlencode(p)
              for origin in [False,True]:
                  try:
                      b,h=get(u,origin);print('PUBLIC_GRAPHIC',json.dumps(dict(url=u,origin=origin,headers={k:v for k,v in h.items() if k.lower() in ['content-type','access-control-allow-origin','content-length']},bytes=len(b),png=b.startswith(b'\\x89PNG'),head=b[:12].hex())),flush=True)
                      if b.startswith(bytes([137,80,78,71])):print('GRAPHIC_PNG',base64.b64encode(b).decode(),flush=True)
                  except Exception as e:print('PUBLIC_GRAPHIC_ERROR',origin,str(e),flush=True)
          