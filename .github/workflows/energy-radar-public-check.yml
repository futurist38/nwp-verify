name: energy-radar-public-check
on:
  push:
    paths: ['.github/workflows/energy-radar-public-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public HSR graphic and PNG access
        shell: python
        run: |
          import urllib.request,urllib.parse,json,datetime,base64,struct
          tm=(datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))-datetime.timedelta(minutes=10)).strftime('%Y%m%d%H%M')
          tm=tm[:-1]+str(int(tm[-1])//5*5)
          p=dict(aws='1',cmp='HSR',qcd='HSO',obs='ECHO',grid='2',legend='1',map='HR',color='C4',size='643',itv='',gov='KMA',lonlat='0',tm=tm,zoom_level='0',zoom_x='0000000',zoom_y='0000000',xp='512',yp='512',zoom='1')
          url='https://radar.kma.go.kr/cgi-bin/center/nph-rdr_cmp2_img?'+urllib.parse.urlencode(p)
          for origin in [False,True]:
              try:
                  req=urllib.request.Request(url,headers={'Origin':'https://futurist38.github.io'} if origin else {})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      b=r.read(3000000);h=r.headers
                      png=b.startswith(bytes([137,80,78,71]))
                      print('RESULT',json.dumps(dict(url=url,origin=origin,status=r.status,bytes=len(b),content_type=h.get('Content-Type'),cors=h.get('Access-Control-Allow-Origin'),dimensions=struct.unpack('>II',b[16:24]) if png else None)),flush=True)
                      if png and not origin:print('GRAPHIC_PNG',base64.b64encode(b).decode(),flush=True)
                      elif not png:print('BODY_SAMPLE',b[:300],flush=True)
              except Exception as e:print('RESULT_ERROR',origin,str(e),flush=True)
          