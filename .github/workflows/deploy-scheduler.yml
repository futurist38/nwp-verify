name: deploy-scheduler
on:
  push:
    branches: [main]
    paths:
      - scheduler/worker.js
      - scheduler/wrangler.toml
      - .github/workflows/deploy-scheduler.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scheduler and imagery tests
        run: node --test imagery-service/worker.test.mjs
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is not connected: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then exit 1; fi
          fi
      - name: Deploy existing Worker with all six cron triggers
        if: steps.credentials.outputs.ready == 'true'
        working-directory: scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
