name: obs-hourly

# 관측·나우캐스트 시간별 갱신 (2026-08-21 사용자 요청 — "8시인데 6시 관측만 보임").
# ASOS 시간자료는 정시 후 10~15분께 확정.
#
# 20분 간격으로 거는 이유(2026-08-27 실측): GitHub 무료 스케줄은 best-effort라
# "20 * * * *"(매시 1회)로 걸었더니 실제 실행 간격이 55분~10시간으로 벌어졌다.
# 여러 번 걸어 두면 그중 일부만 떠도 대체로 시간당 1회는 확보된다.
# 동시 실행은 concurrency가 막고, 밀린 것은 취소되므로 부하가 누적되지 않는다.
# 전체 파이프라인(daily.yml)과 site-data 발행이 겹치지 않게 concurrency 그룹 공유.

on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nwp-site-publish
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONIOENCODING: utf-8
  KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}

jobs:
  obs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nowcast.txt

      - name: 시스템 의존성 (한글 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: Python 의존성
        run: pip install -r requirements.txt

      - name: 관측 수신·지도 생성 (어제+오늘)
        run: timeout 600 python plot_obsmap.py --no-plot

      - name: 단기예보 vs 실측 시계열
        # KMA API가 붐비면 발표시각 수신이 10분+ (2026-08-25 실측: 이 단계가 잡 상한을
        # 먹고 관측 발행까지 스킵). 개별 상한으로 격리 — 실패해도 관측은 나간다
        run: timeout 480 python plot_kmafcst.py --no-fetch --no-plot || echo "::warning::단기예보 비교 실패/시간초과 — 계속"

      - name: site-data 복원 (나우캐스트 채점 대기분 포함)
        run: |
          mkdir -p site_build
          git fetch origin site-data
          git --work-tree=site_build checkout FETCH_HEAD -- .
          git reset > /dev/null
          # 이전 런의 채점 대기 예측장 복원 (러너 휘발성 대응)
          if [ -d site_build/nowcast/fields ]; then
            mkdir -p output/nowcast/fields
            cp site_build/nowcast/fields/*.npz output/nowcast/fields/ 2>/dev/null || true
          fi

      - name: 나우캐스트 가중치 (Release 자산)
        id: ncw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          if gh release download nowcast-weights -p "gk2a_v5*" -D dl --clobber; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::나우캐스트 가중치 릴리스 없음 — 단계 건너뜀"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 운량 나우캐스트 (M4 추론·표출·지속채점)
        if: steps.ncw.outputs.ok == 'true'
        run: |
          pip install -q -r requirements-nowcast.txt
          timeout 600 python nowcast_live.py || echo "::warning::나우캐스트 실패/시간초과 — 계속"

      - name: 사이트 조립·발행
        run: |
          python build_site.py --site-dir site_build
          git config user.name "nwp-bot"
          git config user.email "actions@users.noreply.github.com"
          export GIT_INDEX_FILE="$(pwd)/.git/site-index"
          git --work-tree=site_build add -A
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          COMMIT=$(git commit-tree "$TREE" -m "obs $(date '+%Y-%m-%d %H:%M KST')")
          git push --force origin "$COMMIT:refs/heads/site-data"

      # 검증 CSV 커밋은 사이트 발행 뒤에 — 실패해도 관측/나우캐스트 표출은 이미 배포됨.
      # (2026-08-25: 이 단계가 앞에 있다가 실패해 관측 갱신이 4시간 멈춤. 작업트리에
      #  obs·kmafcst 캐시 변경이 남아 있어 rebase가 거부됨 → autostash 필수)
      - name: 나우캐스트 검증 CSV 커밋
        if: steps.ncw.outputs.ok == 'true'
        continue-on-error: true
        run: |
          git add verification/nowcast 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "nowcast 검증 $(date '+%Y-%m-%d %H:%M KST')"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin main
          fi
